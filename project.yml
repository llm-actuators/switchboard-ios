name: SwitchboardIOS
options:
  bundleIdPrefix: io.llm-actuators
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  xcodeVersion: "15.0"

packages:
  Citadel:
    url: https://github.com/orlandos-nl/Citadel
    from: 0.7.0
  swift-nio-transport-services:
    url: https://github.com/apple/swift-nio-transport-services
    from: 1.20.0

targets:
  SwitchboardIOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/SwitchboardIOSCore
      - path: Sources/SwitchboardIOSApp
    dependencies:
      - package: Citadel
      - package: swift-nio-transport-services
        product: NIOTransportServices
    info:
      path: Sources/SwitchboardIOSApp/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        CFBundleDisplayName: Switchboard
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # iOS 14+ Local Network privacy: any connection to RFC1918 / VPN
        # private subnets needs this key + user grant. Without it,
        # connect() to e.g. 172.23.x.x (ZeroTier) silently fails with
        # NIOCore.ChannelError.alreadyClosed. The user sees a one-time
        # prompt on first private-IP attempt and the grant covers all
        # local-class subnets thereafter.
        NSLocalNetworkUsageDescription: "Switchboard connects to your Mac over your local network or ZeroTier VPN to relay wire messages."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.llm-actuators.switchboard-ios
        TARGETED_DEVICE_FAMILY: "1,2" # iPhone + iPad
        SWIFT_VERSION: "5.9"
        ENABLE_PREVIEWS: "YES"
        # Signing — Personal Team (free, 7-day profile lifetime). Override
        # by editing this file or running 'xcodebuild ... DEVELOPMENT_TEAM=X'
        # if you have a paid Apple Developer membership.
        DEVELOPMENT_TEAM: REDACTED_TEAM_ID
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
